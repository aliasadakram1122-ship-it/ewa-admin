<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050B14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EWA Control Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050B14;
      --card: rgba(13, 22, 36, 0.9);
      --border: rgba(0, 229, 255, 0.22);
      --cyan: #00E5FF;
      --green: #10B981;
      --red: #FF003C;
      --amber: #F59E0B;
      --text: #F1F5F9;
      --muted: #8B9BB4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; padding-bottom: 90px;
      background-image: radial-gradient(circle at top right, rgba(0,229,255,0.08), transparent 45%);
      min-height: 100vh;
    }

    /* 🔒 LOGIN SCREEN */
    #login-screen {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg); display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 24px;
    }
    .login-box {
      width: 100%; max-width: 360px; background: var(--card);
      border: 1px solid var(--cyan); border-radius: 16px; padding: 28px 22px;
      box-shadow: 0 0 35px rgba(0,229,255,0.15); text-align: center;
    }
    .logo-title { font-family: 'Orbitron', sans-serif; font-size: 20px; letter-spacing: 2px; margin: 0 0 6px; }
    .logo-title span { color: var(--cyan); }
    .sub-text { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

    .input-field {
      width: 100%; padding: 13px 14px; margin-bottom: 12px;
      background: #03070E; border: 1px solid var(--border);
      border-radius: 10px; color: #fff; font-size: 14px; outline: none;
    }
    .input-field:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,0.25); }
    .pin-input { text-align: center; font-size: 20px; letter-spacing: 6px; font-weight: 700; color: var(--cyan); }

    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--cyan); color: #000; font-family: 'Orbitron', sans-serif;
      font-weight: 800; font-size: 13px; letter-spacing: 1px; cursor: pointer;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* 📱 TOP BAR */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5, 11, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 1px; }
    .brand span { color: var(--cyan); }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--cyan); border-radius: 8px; width: 36px; height: 36px;
      font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* 📊 STATS */
    .container { padding: 14px 16px; max-width: 600px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 10px; text-align: center;
    }
    .stat-num { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 800; }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* 🔍 SEARCH & FILTERS */
    .search-box { position: relative; margin-bottom: 10px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: rgba(0,229,255,0.15); color: var(--cyan); border-color: var(--cyan); }

    /* 👤 USER CARDS */
    .user-card {
      background: var(--card); border: 1px solid var(--border);
      border-left: 4px solid var(--green); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; transition: 0.2s;
    }
    .user-card.blocked { border-left-color: var(--red); opacity: 0.85; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .user-email { font-weight: 700; font-size: 14px; word-break: break-all; }
    .badge {
      font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
    }
    .badge-active { background: rgba(16,185,129,0.18); color: var(--green); border: 1px solid rgba(16,185,129,0.4); }
    .badge-blocked { background: rgba(255,0,60,0.18); color: var(--red); border: 1px solid rgba(255,0,60,0.4); }

    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: rgba(0,0,0,0.35); padding: 10px; border-radius: 8px;
      font-size: 12px; margin-bottom: 12px;
    }
    .meta-item span { display: block; font-size: 10px; color: var(--muted); }
    .meta-item b { color: #fff; font-weight: 600; word-break: break-all; }

    .card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; }
    .act-btn {
      padding: 9px 6px; border-radius: 8px; font-size: 11px; font-weight: 700;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: #fff; cursor: pointer; text-align: center;
    }
    .act-block { color: var(--red); border-color: rgba(255,0,60,0.35); }
    .act-unblock { color: var(--green); border-color: rgba(16,185,129,0.35); }
    .act-reset { color: var(--amber); border-color: rgba(245,158,11,0.35); }
    .act-edit { color: var(--cyan); border-color: rgba(0,229,255,0.35); }
    .act-del { color: var(--red); border-color: rgba(255,0,60,0.3); padding: 9px 10px; }

    /* ➕ FAB */
    .fab {
      position: fixed; bottom: 22px; right: 20px; z-index: 200;
      width: 58px; height: 58px; border-radius: 50%; border: none;
      background: var(--cyan); color: #000; font-size: 28px; font-weight: 700;
      box-shadow: 0 0 25px rgba(0,229,255,0.5); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* 🪟 MODAL */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; padding: 18px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 380px; background: #0A1220;
      border: 1px solid var(--cyan); border-radius: 14px; padding: 20px;
    }
    .modal-title { font-family: 'Orbitron', sans-serif; font-size: 15px; color: var(--cyan); margin: 0 0 14px; }
    .row-btns { display: flex; gap: 8px; margin-top: 6px; }
    .btn-cancel {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-weight: 700; cursor: pointer;
    }
    .quick-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .chip {
      flex: 1; padding: 7px; font-size: 11px; font-weight: 600; border-radius: 6px;
      border: 1px solid var(--border); background: rgba(0,229,255,0.08); color: var(--cyan); cursor: pointer;
    }

    /* 🔔 TOAST */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #0F172A; border: 1px solid var(--cyan); color: #fff;
      padding: 10px 18px; border-radius: 30px; font-size: 12px; font-weight: 600;
      z-index: 2000; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.6); white-space: nowrap;
    }
    .empty-state { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 13px; }
  </style>
</head>
<body>

  <!-- 🔒 LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-box">
      <h1 class="logo-title">EWA <span>ADMIN</span></h1>
      <p class="sub-text">Extension Remote Control Center</p>
      <input type="url" id="setup-url" class="input-field" placeholder="Apps Script Web App URL" />
      <input type="password" id="setup-pin" class="input-field pin-input" placeholder="PIN" maxlength="10" />
      <button class="btn-primary" onclick="connectApp()">UNLOCK VAULT</button>
    </div>
  </div>

  <!-- 📱 MAIN APP -->
  <header>
    <div class="brand">EWA <span>CONTROL</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="loadUsers()" title="Refresh">🔄</button>
      <button class="icon-btn" onclick="logoutApp()" title="Lock">🔒</button>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="st-total" style="color:var(--cyan)">0</div>
        <div class="stat-lbl">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="st-active" style="color:var(--green)">0</div>
        <div class="stat-lbl">Active</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="st-blocked" style="color:var(--red)">0</div>
        <div class="stat-lbl">Blocked</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" class="input-field" placeholder="🔍 Search email or device ID..." oninput="renderUsers()" style="margin-bottom:0" />
    </div>

    <div class="filter-tabs" style="margin-top:10px;">
      <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
      <button class="tab-btn" onclick="setFilter('active', this)">Active</button>
      <button class="tab-btn" onclick="setFilter('blocked', this)">Blocked</button>
    </div>

    <div id="users-list">
      <div class="empty-state">Loading users...</div>
    </div>
  </div>

  <button class="fab" onclick="openAddModal()">+</button>

  <!-- ➕ ADD USER MODAL -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-box">
      <h3 class="modal-title">➕ ADD NEW USER</h3>
      <input type="email" id="add-email" class="input-field" placeholder="User Email" />
      <div style="display:flex; gap:6px;">
        <input type="text" id="add-pass" class="input-field" placeholder="Password / Key" />
        <button class="chip" style="flex:0 0 70px; height:45px;" onclick="genPass('add-pass')">🎲 Gen</button>
      </div>
      <input type="date" id="add-expiry" class="input-field" />
      <div class="quick-row">
        <button class="chip" onclick="setExpiryDays('add-expiry', 30)">+30 Days</button>
        <button class="chip" onclick="setExpiryDays('add-expiry', 90)">+90 Days</button>
        <button class="chip" onclick="setExpiryDays('add-expiry', 365)">+1 Year</button>
      </div>
      <div class="row-btns">
        <button class="btn-cancel" onclick="closeModal('add-modal')">Cancel</button>
        <button class="btn-primary" style="flex:1" onclick="submitAddUser()">ADD USER</button>
      </div>
    </div>
  </div>

  <!-- ✏️ EDIT USER MODAL -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <h3 class="modal-title">✏️ EDIT USER</h3>
      <div id="edit-email-lbl" style="font-size:12px; color:var(--muted); margin-bottom:10px;"></div>
      <input type="hidden" id="edit-row" />
      <input type="text" id="edit-pass" class="input-field" placeholder="Password" />
      <input type="date" id="edit-expiry" class="input-field" />
      <div class="quick-row">
        <button class="chip" onclick="setExpiryDays('edit-expiry', 30)">+30 Days</button>
        <button class="chip" onclick="setExpiryDays('edit-expiry', 90)">+90 Days</button>
        <button class="chip" onclick="setExpiryDays('edit-expiry', 365)">+1 Year</button>
      </div>
      <div class="row-btns">
        <button class="btn-cancel" onclick="closeModal('edit-modal')">Cancel</button>
        <button class="btn-primary" style="flex:1" onclick="submitEditUser()">SAVE</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let API_URL = localStorage.getItem('EWA_API_URL') || '';
    let ADMIN_PIN = localStorage.getItem('EWA_ADMIN_PIN') || '';
    let allUsers = [];
    let currentFilter = 'all';

    // Init saved URL
    document.getElementById('setup-url').value = API_URL;
    if (API_URL && ADMIN_PIN) {
      document.getElementById('login-screen').style.display = 'none';
      loadUsers();
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.borderColor = isError ? 'var(--red)' : 'var(--cyan)';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2600);
    }

    async function apiCall(payload) {
      payload.pin = ADMIN_PIN;
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function connectApp() {
      const url = document.getElementById('setup-url').value.trim();
      const pin = document.getElementById('setup-pin').value.trim();
      if (!url || !pin) return showToast("URL aur PIN dono daalein!", true);

      API_URL = url;
      ADMIN_PIN = pin;
      showToast("Connecting...");
      try {
        const res = await apiCall({ action: 'getUsers' });
        if (!res.ok) return showToast(res.error || "Access Denied!", true);

        localStorage.setItem('EWA_API_URL', API_URL);
        localStorage.setItem('EWA_ADMIN_PIN', ADMIN_PIN);
        document.getElementById('login-screen').style.display = 'none';
        allUsers = res.users || [];
        updateStats();
        renderUsers();
        showToast("Connected!");
      } catch (e) {
        showToast("Connection failed! URL check karein.", true);
      }
    }

    function logoutApp() {
      localStorage.removeItem('EWA_ADMIN_PIN');
      ADMIN_PIN = '';
      document.getElementById('setup-pin').value = '';
      document.getElementById('login-screen').style.display = 'flex';
    }

    async function loadUsers() {
      document.getElementById('users-list').innerHTML = '<div class="empty-state">⏳ Syncing with Sheet...</div>';
      try {
        const res = await apiCall({ action: 'getUsers' });
        if (!res.ok) return showToast(res.error, true);
        allUsers = res.users || [];
        updateStats();
        renderUsers();
      } catch (e) {
        showToast("Sync error!", true);
      }
    }

    function updateStats() {
      const total = allUsers.length;
      const blocked = allUsers.filter(u => u.status.toLowerCase() === 'blocked').length;
      const active = total - blocked;
      document.getElementById('st-total').innerText = total;
      document.getElementById('st-active').innerText = active;
      document.getElementById('st-blocked').innerText = blocked;
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderUsers();
    }

    function renderUsers() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const list = document.getElementById('users-list');

      const filtered = allUsers.filter(u => {
        const isBlocked = u.status.toLowerCase() === 'blocked';
        if (currentFilter === 'active' && isBlocked) return false;
        if (currentFilter === 'blocked' && !isBlocked) return false;
        if (q && !u.email.toLowerCase().includes(q) && !u.deviceId.toLowerCase().includes(q)) return false;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">Koi user nahi mila.</div>';
        return;
      }

      list.innerHTML = filtered.map(u => {
        const isBlocked = u.status.toLowerCase() === 'blocked';
        const nextStatus = isBlocked ? 'Active' : 'Blocked';
        const devShort = u.deviceId ? (u.deviceId.length > 14 ? u.deviceId.slice(0, 14) + '…' : u.deviceId) : 'Not Bound';
        const tokenState = u.activeToken ? '🟢 Online' : '⚪ Offline';

        return `
          <div class="user-card ${isBlocked ? 'blocked' : ''}">
            <div class="card-top">
              <div class="user-email">${escapeHtml(u.email)}</div>
              <span class="badge ${isBlocked ? 'badge-blocked' : 'badge-active'}">${escapeHtml(u.status)}</span>
            </div>
            <div class="meta-grid">
              <div class="meta-item"><span>Password</span><b>${escapeHtml(u.password)}</b></div>
              <div class="meta-item"><span>Expiry</span><b>${escapeHtml(u.expiry || 'No Limit')}</b></div>
              <div class="meta-item"><span>Device ID</span><b>${escapeHtml(devShort)}</b></div>
              <div class="meta-item"><span>Session</span><b>${tokenState}</b></div>
            </div>
            <div class="card-actions">
              <button class="act-btn ${isBlocked ? 'act-unblock' : 'act-block'}" onclick="toggleStatus(${u.row}, '${nextStatus}')">
                ${isBlocked ? '✅ Unblock' : '🚫 Block'}
              </button>
              <button class="act-btn act-reset" onclick="resetDevice(${u.row})">🔄 Reset PC</button>
              <button class="act-btn act-edit" onclick="openEditModal(${u.row})">✏️ Edit</button>
              <button class="act-btn act-del" onclick="deleteUser(${u.row}, '${escapeHtml(u.email)}')">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleStatus(row, newStatus) {
      showToast("Updating...");
      const res = await apiCall({ action: 'toggleStatus', row, status: newStatus });
      if (res.ok) { showToast(res.message); loadUsers(); }
      else showToast(res.error, true);
    }

    async function resetDevice(row) {
      if (!confirm("Device ID aur Active Token clear karein? (User logout ho jayega)")) return;
      showToast("Resetting...");
      const res = await apiCall({ action: 'resetDevice', row });
      if (res.ok) { showToast(res.message); loadUsers(); }
      else showToast(res.error, true);
    }

    async function deleteUser(row, email) {
      if (!confirm(`Delete ${email}?`)) return;
      showToast("Deleting...");
      const res = await apiCall({ action: 'deleteUser', row });
      if (res.ok) { showToast(res.message); loadUsers(); }
      else showToast(res.error, true);
    }

    function openAddModal() {
      document.getElementById('add-email').value = '';
      genPass('add-pass');
      setExpiryDays('add-expiry', 30);
      document.getElementById('add-modal').classList.add('open');
    }

    async function submitAddUser() {
      const email = document.getElementById('add-email').value.trim();
      const password = document.getElementById('add-pass').value.trim();
      const expiry = document.getElementById('add-expiry').value;
      if (!email || !password) return showToast("Email & Password daalein!", true);

      closeModal('add-modal');
      showToast("Adding user...");
      const res = await apiCall({ action: 'addUser', email, password, status: 'Active', expiry });
      if (res.ok) { showToast("User Added!"); loadUsers(); }
      else showToast(res.error, true);
    }

    function openEditModal(row) {
      const u = allUsers.find(x => x.row === row);
      if (!u) return;
      document.getElementById('edit-row').value = row;
      document.getElementById('edit-email-lbl').innerText = u.email;
      document.getElementById('edit-pass').value = u.password;
      document.getElementById('edit-expiry').value = u.expiry;
      document.getElementById('edit-modal').classList.add('open');
    }

    async function submitEditUser() {
      const row = Number(document.getElementById('edit-row').value);
      const password = document.getElementById('edit-pass').value.trim();
      const expiry = document.getElementById('edit-expiry').value;
      closeModal('edit-modal');
      showToast("Saving...");
      const res = await apiCall({ action: 'updateUser', row, password, expiry });
      if (res.ok) { showToast("Saved!"); loadUsers(); }
      else showToast(res.error, true);
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function genPass(inputId) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let key = "EWA-";
      for (let i = 0; i < 6; i++) key += chars[Math.floor(Math.random() * chars.length)];
      document.getElementById(inputId).value = key;
    }

    function setExpiryDays(inputId, days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      document.getElementById(inputId).value = d.toISOString().split('T')[0];
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
